{% extends "base.html" %}
{% block title %}Setup — {{ app_name }}{% endblock %}
{% block shell_class %}shell-center{% endblock %}
{% block content %}
<section class="auth-panel">
  <div class="brand-inline">
    <div class="auth-icon"><img src="{{ url_for('static', filename='img/logo.png') }}" alt="{{ app_name }}" /></div>
    <div>
      <p class="eyebrow">First launch</p>
      <h1>{{ app_name }}</h1>
    </div>
  </div>
  <p class="lede">Set a shared PIN to protect this dashboard on your VM.</p>
  <form method="post" class="stack-form">
    <label>
      <span>PIN</span>
      <input type="password" name="pin" minlength="4" required autofocus autocomplete="new-password" />
    </label>
    <label>
      <span>Confirm PIN</span>
      <input type="password" name="confirm" minlength="4" required autocomplete="new-password" />
    </label>
    <button type="submit" class="btn btn-primary">
      <i data-lucide="save" class="icon"></i>Save PIN &amp; continue
    </button>
  </form>
</section>
{% endblock %}
